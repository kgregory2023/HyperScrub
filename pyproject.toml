[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperscrub"
version = "0.1.0.dev0"
description = "Local, multicore PDF redaction CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kieren Gregory" }
]
keywords = [
    "pdf",
    "redaction",
    "privacy",
    "pii",
    "ocr",
    "multiprocessing",
    "cli",
]

dependencies = [
    "PyMuPDF",
    "PyYAML",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
hyperscrub = "hyperscrub.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/kgregory2023/HyperScrub"
Repository = "https://github.com/kgregory2023/HyperScrub"
Issues = "https://github.com/kgregory2023/HyperScrub/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
